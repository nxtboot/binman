[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-manager"
version = "0.1.2"
authors = [
  { name="Simon Glass", email="sjg@chromium.org" },
]
description = "Package firmware binaries into images described by a devicetree"
readme = "README.rst"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
keywords = ["firmware", "image", "devicetree", "u-boot", "fit", "cbfs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Boot",
    "Intended Audience :: Developers",
]
dependencies = [
    "pylibfdt >= 1.7",
    "pyelftools",
    "pycryptodomex",
    "jsonschema",
    "PyYAML",
    "yamllint",
]

[project.optional-dependencies]
# Running the test suite (parallel test execution and coverage)
test = ["concurrencytest", "coverage"]

[project.urls]
Homepage = "https://github.com/nxtboot/binman"
Documentation = "https://binman.readthedocs.io/"
Repository = "https://github.com/nxtboot/binman"
"Bug Tracker" = "https://github.com/nxtboot/binman/issues"

[project.scripts]
binman = "binman.main:start_binman"

[tool.setuptools.packages.find]
# binman.test and its subdirs hold the test data, found as namespace packages.
# binman._vendor holds the vendored libraries (see binman/__init__.py)
include = ["binman*"]

[tool.setuptools.package-data]
binman = ["*.rst", "*.yaml", "missing-blob-help"]
"binman.test" = ["**/*"]
